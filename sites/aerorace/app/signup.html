<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - Stitch-sites | Pilot Registration</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%230e7490'/><circle cx='50' cy='50' r='20' fill='%2322c55e'/><path d='M20 50 L80 50 M50 20 L50 80' stroke='white' stroke-width='6'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-cyan-900/40 rounded-2xl p-8 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-tr   flex items-center justify-center text-white text-2xl font-bold mx-auto shadow-lg shadow-cyan-500/20">
                <i data-lucide="crosshairs" class="fas"></i>
            </div>
            <h1 class="text-2xl font-black text-white uppercase tracking-wider">Pilot Super License</h1>
            <p class="text-xs text-slate-400 font-mono">2026 AeroRace World Championship</p>
        </div>

        <form onsubmit="event.preventDefault(); window.location.href='index.html';" class="space-y-4 text-xs">
            <div>
                <label class="block text-slate-300 mb-1 font-mono">Pilot Full Name</label>
                <input type="text" required placeholder="Pavlo Havras" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500">
            </div>
            <div>
                <label class="block text-slate-300 mb-1 font-mono">Desired Call Sign</label>
                <input type="text" required placeholder="VORTEX" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500 font-mono">
            </div>
            <div>
                <label class="block text-slate-300 mb-1 font-mono">Work Email</label>
                <input type="email" required placeholder="pilot@team.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500">
            </div>
            <div>
                <label class="block text-slate-300 mb-1 font-mono">License Passcode</label>
                <input type="password" required placeholder="At least 8 characters" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500">
            </div>
            <div class="flex items-center space-x-2 text-[11px] text-slate-400 font-mono">
                <input type="checkbox" required class="rounded bg-slate-950 border-slate-700 text-cyan-400">
                <span>I agree to FAI safety code &amp; failsafe rules</span>
            </div>
            <button type="submit" class="w-full py-3    hover: hover: text-slate-950 rounded-xl font-bold uppercase tracking-wider transition shadow-lg shadow-cyan-500/25">
                Apply for Super License
            </button>
        </form>

        <div class="text-center text-xs text-slate-400 pt-2 font-mono">
            Already have a license? <a href="login.html" class="text-cyan-400 hover:underline">Log in</a>
        </div>
    </div>
<script>lucide.createIcons();</script>
</body>
</html>
