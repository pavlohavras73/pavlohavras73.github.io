<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - Stitch-sites | Create Free Account</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%230284c7'/><path d='M25 50 L75 30 L60 70 L48 56 L42 66 Z' fill='white'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-gray-900 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-tr   flex items-center justify-center text-gray-900 text-2xl font-bold mx-auto shadow-lg shadow-sky-500/20">
                <i data-lucide="telegram-plane" class="fab"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">Start Building Free</h1>
            <p class="text-xs text-slate-400">Includes 2,000 monthly messages &amp; visual canvas</p>
        </div>

        <form onsubmit="event.preventDefault(); window.location.href='index.html';" class="space-y-4 text-xs">
            <div>
                <label class="block text-slate-300 mb-1">Full Name</label>
                <input type="text" required placeholder="Pavlo Havras" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-gray-900 focus:outline-none focus:border-sky-500">
            </div>
            <div>
                <label class="block text-slate-300 mb-1">Email Address</label>
                <input type="email" required placeholder="pavlo@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-gray-900 focus:outline-none focus:border-sky-500">
            </div>
            <div>
                <label class="block text-slate-300 mb-1">Password</label>
                <input type="password" required placeholder="At least 8 characters" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-gray-900 focus:outline-none focus:border-sky-500">
            </div>
            <div class="flex items-center space-x-2 text-[11px] text-slate-400">
                <input type="checkbox" required class="rounded bg-slate-950 border-slate-700 text-sky-500">
                <span>I agree to the Terms of Service &amp; Privacy Policy</span>
            </div>
            <button type="submit" class="w-full py-3    hover: hover: text-gray-900 rounded-xl font-semibold transition shadow-lg shadow-sky-500/25">
                Create BotForge Account
            </button>
        </form>

        <div class="text-center text-xs text-slate-400 pt-2">
            Already have an account? <a href="login.html" class="text-sky-400 hover:underline">Sign in</a>
        </div>
    </div>
<script>lucide.createIcons();</script>
</body>
</html>
